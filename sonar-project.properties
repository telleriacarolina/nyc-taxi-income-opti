# SonarQube Project Configuration
# NYC TAXI Income Optimizer

# Project identification
sonar.projectKey=telleriacarolina_nyc-taxi-income-opti
sonar.organization=telleriacarolina
sonar.projectName=NYC TAXI Income Optimizer
sonar.projectVersion=1.0.0

# Authentication
sonar.host.url=https://sonarcloud.io
# Token will be loaded from environment variable SONAR_TOKEN

# Source code location
sonar.sources=src
sonar.tests=src

# Test file patterns
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Exclusions - files/directories not to analyze
sonar.exclusions=**/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/coverage/**,\
  **/*.config.js,\
  **/*.config.ts,\
  **/vite.config.ts,\
  **/tailwind.config.js

# TypeScript/JavaScript settings
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPath=tsconfig.json

# Code coverage exclusions
sonar.coverage.exclusions=**/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/*.d.ts,\
  **/types/**

# Language
sonar.language=ts

# Encoding
sonar.sourceEncoding=UTF-8

# File size limit (MB)
sonar.filesize.limit=20
