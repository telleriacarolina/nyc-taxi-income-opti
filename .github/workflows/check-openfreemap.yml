# Monthly OpenFreeMap Update Check with Auto-PR
# Automatically checks for new OpenFreeMap commits and creates a pull request with changelog

name: Check OpenFreeMap Updates

on:
  schedule:
    # Run on the 1st of each month at 9 AM UTC
    - cron: '0 9 1 * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  check-updates:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Fetch OpenFreeMap remote
        run: |
          git remote add openfreemap https://github.com/telleriacarolina/openfreemap.git || true
          git fetch openfreemap
      
      - name: Check for new commits
        id: check
        run: |
          # Count new commits
          NEW_COMMITS=$(git rev-list HEAD..openfreemap/main --count 2>/dev/null || echo "0")
          echo "new_commits=$NEW_COMMITS" >> $GITHUB_OUTPUT
          
          # Get recent commit messages
          if [ "$NEW_COMMITS" -gt 0 ]; then
            echo "commits<<EOF" >> $GITHUB_OUTPUT
            git log openfreemap/main --oneline -20 >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            
            # Get detailed commit info for changelog
            echo "detailed_commits<<EOF" >> $GITHUB_OUTPUT
            git log openfreemap/main --pretty=format:"- **%h** %s (%ar)" -20 >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi
      
      - name: Create update branch and changelog
        if: steps.check.outputs.new_commits > 0
        run: |
          # Create a new branch
          BRANCH_NAME="openfreemap-updates-$(date +%Y-%m)"
          git checkout -b "$BRANCH_NAME"
          
          # Update the changelog
          CURRENT_DATE=$(date +"%B %Y")
          sed -i "s/^## Review History/## Review History\n\n### $CURRENT_DATE\n\n**New Commits Found**: ${{ steps.check.outputs.new_commits }}\n\n${{ steps.check.outputs.detailed_commits }}\n\n**Status**: Auto-detected by GitHub Actions\n\n**Action Required**: Review commits and cherry-pick relevant changes\n/" .github/OPENFREEMAP_CHANGELOG.md
          
          # Commit the changelog update
          git add .github/OPENFREEMAP_CHANGELOG.md
          git commit -m "chore: auto-update OpenFreeMap changelog with ${{ steps.check.outputs.new_commits }} new commits"
          
          # Push the branch
          git push origin "$BRANCH_NAME"
          
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
        id: update
      
      - name: Create Pull Request
        if: steps.check.outputs.new_commits > 0
        uses: actions/github-script@v7
        with:
          script: |
            const newCommits = '${{ steps.check.outputs.new_commits }}';
            const commits = `${{ steps.check.outputs.commits }}`;
            const detailedCommits = `${{ steps.check.outputs.detailed_commits }}`;
            const branchName = '${{ steps.update.outputs.branch_name }}';
            
            const body = `## 🗺️ OpenFreeMap Updates Auto-Detected
            
            This PR automatically updates the changelog with **${newCommits} new commit(s)** from the OpenFreeMap repository.
            
            ### What Changed
            
            ✅ Updated \`.github/OPENFREEMAP_CHANGELOG.md\` with new commits
            
            ### Recent Commits
            
            ${detailedCommits}
            
            <details>
            <summary>View commit hashes</summary>
            
            \`\`\`
            ${commits}
            \`\`\`
            </details>
            
            ### Action Required
            
            1. **Review the commits** to identify relevant changes:
               \`\`\`bash
               npm run review:openfreemap
               \`\`\`
            
            2. **Check for tile/map improvements**:
               \`\`\`bash
               git log openfreemap/main --grep="tile|leaflet|map|performance" --oneline
               \`\`\`
            
            3. **Compare implementations**:
               \`\`\`bash
               git diff main openfreemap/main -- '*.md' '*.json'
               \`\`\`
            
            4. **If useful changes found**:
               - Cherry-pick specific commits
               - Test in development
               - Update implementation notes in the changelog
            
            5. **Merge this PR** to update the changelog (no code changes)
            
            ### Quick Commands
            
            \`\`\`bash
            # Fetch latest OpenFreeMap updates
            npm run fetch:openfreemap
            
            # View specific commit details
            git show openfreemap/main~5  # 5 commits ago
            
            # Search for specific features
            git log openfreemap/main --grep="vector tiles" --oneline
            \`\`\`
            
            ### Documentation
            
            - [OpenFreeMap Integration Guide](.github/OPENFREEMAP.md)
            - [Quick Reference](.github/QUICK_REFERENCE.md)
            - [Git Remotes Documentation](.github/GIT_REMOTES.md)
            
            ---
            
            🤖 *This PR was automatically created by GitHub Actions*`;
            
            const pr = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🗺️ OpenFreeMap Updates - ${newCommits} new commits`,
              head: branchName,
              base: 'main',
              body: body
            });
            
            // Add labels
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.data.number,
              labels: ['openfreemap', 'dependencies', 'automated']
            });
            
            console.log(`Created PR #${pr.data.number}`);
